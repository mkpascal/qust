[package]
name = "qust-ui"
version = "0.1.0"
description = "What Qust's windows share: the player's state as a model, the bridge to the player, capture and test support"
license = "GPL-3.0-or-later"
edition = "2021"
publish = false

[features]
# The capture and test harness (`qust_ui::capture`): real windows rendered to PNG, events
# dispatched into views. Pulls in GPUI's test support, so only examples and tests enable it.
capture = ["gpui/test-support", "gpui_platform/test-support", "dep:image"]

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-component = "=0.9.1"
qust-fluent = { path = "../fluent" }
qust-player = { path = "../player" }
qust-updater = { path = "../updater" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12" }

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_UI_Accessibility"] }
windows-registry = "0.6"

[target."cfg(target_os = \"macos\")".dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit"] }

[dev-dependencies]
qust-player = { path = "../player" }

[[example]]
name = "capture"
required-features = ["capture"]

[[test]]
name = "bridge"
harness = false
required-features = ["capture"]
