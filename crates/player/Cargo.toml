[package]
name = "qust-player"
version = "0.1.0"
description = "Qust's player: cartridges, playlist, state machine and saving, with no UI"
license = "GPL-3.0-or-later"
edition = "2021"
publish = false

[dependencies]
qust-audio = { path = "../audio" }
qust-codecs = { path = "../codecs" }
qust-spectrum = { path = "../spectrum" }
serde_json = "1"
url = "2"
# The config dir, as Tauri's path resolver finds it (the same crate and version).
dirs = "7"

[target."cfg(windows)".dependencies]
windows-registry = "0.100.0"
