[package]
name = "qust-app"
version.workspace = true
description = "Qust, the application"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
publish = false
build = "build.rs"

[lib]
name = "qust_app"
path = "src/lib.rs"

# qust.exe / Contents/MacOS/qust: the name every installed copy, its shortcuts, startup entry and
# updater know.
[[bin]]
name = "qust"
path = "src/main.rs"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12" }
qust-fluent = { path = "../fluent" }
qust-ui = { path = "../ui" }
qust-ui-player = { path = "../ui-player" }
qust-ui-playlist = { path = "../ui-playlist" }
qust-ui-panels = { path = "../ui-panels" }
qust-shell = { path = "../shell", features = ["gpui"] }
qust-player = { path = "../player" }
qust-updater = { path = "../updater" }
# The vendored GPUI patch (see the workspace manifest) lays right-to-left runs out natively.
qust-text = { path = "../text", features = ["native-bidi"] }
serde = "1"
serde_json = "1"
futures = "0.3"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_SystemInformation"] }

[target."cfg(target_os = \"macos\")".dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit"] }

[build-dependencies]
embed-resource = "3.0.12"
serde_json = "1"

[dev-dependencies]
qust-ui = { path = "../ui", features = ["capture"] }
qust-ui-player = { path = "../ui-player", features = ["capture"] }
qust-ui-playlist = { path = "../ui-playlist", features = ["capture"] }
gpui-component = "=0.9.1"

[[test]]
name = "end_to_end"
harness = false

# Full-window captures of the composed player window, compared with the reference renders.
[[example]]
name = "app_capture"

# A local live stream (WAV, ICY titles) for measurements and manual tests.
[[example]]
name = "test_stream"
