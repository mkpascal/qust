[package]
name = "qust-ui-playlist"
version = "0.1.0"
description = "Qust's playlist drawer"
license = "GPL-3.0-or-later"
edition = "2021"
publish = false

[features]
# The fixture interpreter (`harness`) for captures and tests: needs qust-ui's capture harness.
capture = ["qust-ui/capture", "dep:serde_json"]

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
qust-fluent = { path = "../fluent" }
qust-ui = { path = "../ui" }
# Only `menu::Menu`, the native menu's description (no GPUI glue).
qust-shell = { path = "../shell" }
# Right-to-left titles: what a row draws of its title and detail.
qust-text = { path = "../text" }
serde_json = { version = "1", optional = true }

[dev-dependencies]
qust-ui = { path = "../ui", features = ["capture"] }
qust-player = { path = "../player" }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[[example]]
name = "playlist_capture"
required-features = ["capture"]

[[test]]
name = "behaviour"
harness = false
required-features = ["capture"]

[[test]]
name = "scale"
harness = false
required-features = ["capture"]

[[test]]
name = "end_to_end"
harness = false
required-features = ["capture"]
