name: Build

# Every push to main builds Windows and macOS. When the version in Cargo.toml ([workspace.package])
# has no release
# yet, the push also publishes a GitHub release "Qust vX.Y.Z" with the installers and the signed
# updater files (latest.json), which installed copies of Qust update from: the GPUI versions and
# the Tauri ones before them read the same latest.json.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A draft until both platforms have uploaded, so the updater never sees a half-done release.
      # A draft left by a failed run is replaced; a published release means nothing to do.
      - id: create
        if: github.event_name == 'push'
        run: |
          tag="v${{ steps.version.outputs.version }}"
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2> /dev/null || echo missing)
          if [ "$draft" = false ]; then
            exit 0
          fi
          if [ "$draft" = true ]; then
            gh release delete "$tag" --yes
          fi
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" \
            -f name="Qust $tag" -F draft=true -F generate_release_notes=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  windows:
    needs: release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      # GPUI needs the Windows SDK's fxc.exe and rc.exe, which the runner image has.
      - run: cargo build --release --locked -p qust-app

      # NSIS for the installer (build-installer.mjs looks in Program Files), unless the image has it.
      - run: |
          if [ ! -f "/c/Program Files (x86)/NSIS/makensis.exe" ] && [ ! -f "/c/Program Files/NSIS/makensis.exe" ] && ! command -v makensis; then
            choco install nsis -y --no-progress
          fi

      - run: node packaging/windows/build-installer.mjs --exe "target/release/qust.exe" --version "$VERSION" --icon "icons/icon.ico" --out dist

      # Releases only: the updaters' signature (the key comes from the repository secrets).
      - if: needs.release.outputs.id
        run: cargo run --release --locked -p qust-updater --features sign --bin qust-sign -- "dist/Qust_${VERSION}_x64-setup.exe" --version "$VERSION"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: qust-windows
          path: dist/*
          if-no-files-found: error

  macos:
    needs: release
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2

      - run: |
          cargo build --release --locked -p qust-app --target aarch64-apple-darwin
          cargo build --release --locked -p qust-app --target x86_64-apple-darwin

      # The bundle, the disk image and the update archive (a universal binary made with lipo).
      - run: |
          packaging/macos/build-app.sh --version "$VERSION" \
            --arm64 "target/aarch64-apple-darwin/release/qust" \
            --x86_64 "target/x86_64-apple-darwin/release/qust" \
            --icon "icons/icon.icns" --out dist
          rm -rf dist/Qust.app

      - if: needs.release.outputs.id
        run: cargo run --release --locked -p qust-updater --features sign --bin qust-sign -- "dist/Qust_${VERSION}_universal.app.tar.gz" --version "$VERSION"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: qust-macos
          path: dist/*
          if-no-files-found: error

  # Windows alone is enough to publish: macOS is best effort, and a failed macOS build must not hold
  # back the Windows release (latest.json then has no macOS entry, and Macs stay where they are).
  publish:
    needs: [release, windows, macos]
    if: always() && needs.release.outputs.id && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # latest.json lists each file under both updaters' platform keys, with its signature.
      - run: |
          mac="dist/Qust_${VERSION}_universal.app.tar.gz"
          if [ -f "$mac" ] && [ -f "$mac.sig" ]; then macos=(--macos "$mac"); else macos=(--allow-missing); fi
          node packaging/latest-json.mjs --version "$VERSION" \
            --windows "dist/Qust_${VERSION}_x64-setup.exe" "${macos[@]}" \
            --out dist/latest.json

      - run: |
          files=()
          for name in "Qust_${VERSION}_x64-setup.exe" "Qust_${VERSION}_x64-setup.exe.sig" "Qust_${VERSION}_universal.dmg" \
            "Qust_${VERSION}_universal.app.tar.gz" "Qust_${VERSION}_universal.app.tar.gz.sig" latest.json; do
            if [ -f "dist/$name" ]; then files+=("dist/$name"); fi
          done
          gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
