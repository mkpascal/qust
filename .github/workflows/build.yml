name: Build

# Every push to main builds Windows and macOS. When the version in package.json has no release
# yet, the push also publishes a GitHub release "Qust vX.Y.Z" with the installers and the signed
# updater files (latest.json), which installed copies of Qust update from.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      # A draft until both platforms have uploaded, so the updater never sees a half-done release.
      # A draft left by a failed run is replaced; a published release means nothing to do.
      - id: create
        if: github.event_name == 'push'
        run: |
          tag="v${{ steps.version.outputs.version }}"
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2> /dev/null || echo missing)
          if [ "$draft" = false ]; then
            exit 0
          fi
          if [ "$draft" = true ]; then
            gh release delete "$tag" --yes
          fi
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" \
            -f name="Qust $tag" -F draft=true -F generate_release_notes=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            rust-targets: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # Releases also build the signed updater files (tauri.release.conf.json), which need the
      # signing key from the repository secrets.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.release.outputs.id && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.release.outputs.id && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          releaseId: ${{ needs.release.outputs.id }}
          args: ${{ matrix.args }} ${{ needs.release.outputs.id && '--config src-tauri/tauri.release.conf.json' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: qust-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    needs: [release, build]
    if: needs.release.outputs.id
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release edit "v${{ needs.release.outputs.version }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
