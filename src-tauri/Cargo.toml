[package]
name = "qust"
version = "1.1.2"
description = "Quick Streaming Player"
authors = ["Pascal Muang Khot"]
license = "GPL-3.0-or-later"
repository = "https://github.com/mkpascal/qust"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde_json = "1"
ureq = "2"
tauri-plugin-updater = "2.14.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target."cfg(windows)".dependencies]
windows-registry = "0.100.0"
windows-version = "0.100.0"
