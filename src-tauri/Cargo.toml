[package]
name = "qust"
version = "1.1.5"
description = "Quick Streaming Player"
authors = ["Pascal Muang Khot"]
license = "GPL-3.0-or-later"
repository = "https://github.com/mkpascal/qust"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde_json = "1"
qust-player = { path = "crates/player" }
tauri-plugin-updater = "2.14.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[workspace]
members = [
    "crates/codecs",
    "crates/audio",
    "crates/spectrum",
    "crates/player",
    "crates/updater",
    "crates/fluent",
    "crates/ui",
    "crates/ui-player",
    "crates/ui-playlist",
    "crates/ui-panels",
    "crates/shell",
    "crates/text",
    "crates/app",
]

# Debug builds decode audio in real time too: without optimization the decoders and the resampler
# would be many times slower.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.qust-audio]
opt-level = 2

[profile.dev.package.qust-codecs]
opt-level = 2

[profile.dev.package.qust-spectrum]
opt-level = 2

[profile.dev.package.qust-player]
opt-level = 2
