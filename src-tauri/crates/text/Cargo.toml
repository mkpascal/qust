[package]
name = "qust-text"
version = "0.1.0"
description = "Text the toolkit cannot lay out by itself: right-to-left titles"
license = "GPL-3.0-or-later"
edition = "2021"
publish = false

[features]
# Set when the app carries the GPUI patch that makes DirectWrite's right-to-left runs come out in
# visual order (see lib.rs): `display` then hands GPUI the logical string, as on macOS.
native-bidi = []

[dependencies]
# The Unicode Bidirectional Algorithm (UAX #9), Unicode 16.
unicode-bidi = "0.3.18"
# Grapheme clusters: a base letter keeps its marks when a right-to-left run is reversed.
unicode-segmentation = "1.13"
# Joining types (Arabic shaping) and mirrored brackets, Unicode 16.
icu_properties = "2.4"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-component = "=0.9.1"
qust-fluent = { path = "../fluent" }
qust-ui = { path = "../ui", features = ["capture"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"

# Named apart from the window crates' `capture` examples: they share one target directory.
[[example]]
name = "text-capture"
path = "examples/capture.rs"
