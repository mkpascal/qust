[package]
name = "qust-updater"
version = "0.1.0"
description = "Qust's updater: checks the GitHub release, verifies and installs it"
license = "GPL-3.0-or-later"
edition = "2021"
publish = false

[features]
# The release signing tool (`qust-sign`), for CI. The app never enables it.
sign = ["dep:minisign"]

[dependencies]
# The same HTTP stack as the audio engine, so the updater adds no second one.
ureq = "2"
serde_json = "1"
base64 = "0.22"
# What tauri-plugin-updater verifies with, so both updaters accept exactly the same signatures.
minisign-verify = "0.3"
semver = "1"
minisign = { version = "0.10", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
flate2 = "1"
tar = "0.4"

[dev-dependencies]
flate2 = "1"
tar = "0.4"

[[bin]]
name = "qust-sign"
path = "src/bin/qust-sign.rs"
required-features = ["sign"]
