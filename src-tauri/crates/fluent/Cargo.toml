[package]
name = "qust-fluent"
version = "0.1.0"
description = "Qust's look: design tokens and the elements every window is built from"
license = "GPL-3.0-or-later"
edition = "2021"
publish = false

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
# Only for `Input` (the text editing engine inside our own text box frame) and its theme colors.
gpui-component = "=0.9.1"
raw-window-handle = "0.6"

[target."cfg(windows)".dependencies]
# The native tooltip control (what WebView2 showed for `title`) and the system accent.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
# The gallery example renders through the capture harness.
qust-ui = { path = "../ui", features = ["capture"] }

[[test]]
name = "behaviour"
harness = false
