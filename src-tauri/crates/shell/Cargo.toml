[package]
name = "qust-shell"
version = "0.1.0"
description = "What the OS provides and the UI toolkit doesn't: tray, global shortcuts, menus, single instance, startup"
license = "GPL-3.0-or-later"
edition = "2021"
publish = false

[features]
# The glue to GPUI (main-thread dispatch, window handles, headless / windowed switching). Without
# it the crate has no GPUI in it, and everything else is tested without a GPUI window.
gpui = ["dep:gpui", "dep:raw-window-handle", "dep:futures"]
# The examples that run a GPUI app (the idle measurements, the menu and window tests).
gpui-examples = ["gpui", "dep:gpui_platform"]

[dependencies]
qust-player = { path = "../player" }
qust-updater = { path = "../updater" }
serde_json = "1"
gpui = { package = "gpui-pre", version = "=0.3.12", optional = true }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", optional = true }
raw-window-handle = { version = "0.6", optional = true }
futures = { version = "0.3", optional = true }

[target."cfg(windows)".dependencies]
windows-registry = "0.100.0"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
dirs = "7"

[[example]]
name = "idle"
required-features = ["gpui-examples"]

[[example]]
name = "gpui_windows"
required-features = ["gpui-examples"]
