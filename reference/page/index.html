<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Qust</title>
    <link href="css/style.css" rel="stylesheet" />
  </head>

  <body>
    <svg class="icons" aria-hidden="true">
      <symbol id="i-play" viewBox="0 0 16 16"><path d="M5 3.3v9.4a.8.8 0 0 0 1.2.7l7.5-4.7a.8.8 0 0 0 0-1.4L6.2 2.6A.8.8 0 0 0 5 3.3z" /></symbol>
      <symbol id="i-pause" viewBox="0 0 16 16"><rect x="3.5" y="2.5" width="3" height="11" rx="1" /><rect x="9.5" y="2.5" width="3" height="11" rx="1" /></symbol>
      <symbol id="i-stop" viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="1.5" /></symbol>
      <symbol id="i-eject" viewBox="0 0 16 16"><path d="M7.3 3.4a.9.9 0 0 1 1.4 0l4 4.9a.6.6 0 0 1-.5 1H3.8a.6.6 0 0 1-.5-1z" /><rect x="3" y="10.6" width="10" height="2" rx=".8" /></symbol>
      <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" /></symbol>
      <symbol id="i-speaker" viewBox="0 0 16 16"><path d="M7.7 2.7 4.6 5.3H2.8a.8.8 0 0 0-.8.8v3.8c0 .4.4.8.8.8h1.8l3.1 2.6a.5.5 0 0 0 .8-.4V3.1a.5.5 0 0 0-.8-.4z" /></symbol>
      <symbol id="i-vol-0" viewBox="0 0 16 16"><use href="#i-speaker" /><path d="m10.5 6 3.5 4m0-4-3.5 4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" /></symbol>
      <symbol id="i-vol-1" viewBox="0 0 16 16"><use href="#i-speaker" /><path d="M10.6 5.8a3 3 0 0 1 0 4.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" /></symbol>
      <symbol id="i-vol-2" viewBox="0 0 16 16"><use href="#i-speaker" /><path d="M10.6 5.8a3 3 0 0 1 0 4.4M12.4 4a5.6 5.6 0 0 1 0 8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" /></symbol>
      <symbol id="i-settings" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.9" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="2.317 2.317" /><circle cx="8" cy="8" r="3.9" fill="none" stroke="currentColor" stroke-width="2.2" /></symbol>
      <symbol id="i-info" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.3" /><path d="M8 7.2v4.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /><circle cx="8" cy="4.9" r=".95" /></symbol>
      <symbol id="i-bolt" viewBox="0 0 16 16"><path d="M9.2 1.6 3.6 9h3.6l-1 5.4L12.4 7H8.8z" /></symbol>
      <symbol id="i-list" viewBox="0 0 16 16"><path d="M5.5 4h8M5.5 8h8M5.5 12h8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" /><circle cx="2.6" cy="4" r=".95" /><circle cx="2.6" cy="8" r=".95" /><circle cx="2.6" cy="12" r=".95" /></symbol>
      <symbol id="i-chevron" viewBox="0 0 16 16"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></symbol>
      <symbol id="i-note" viewBox="0 0 16 16"><path d="M6.5 11.5V3.6l6-1.3v7.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" /><ellipse cx="4.6" cy="11.6" rx="1.9" ry="1.5" /><ellipse cx="10.6" cy="9.8" rx="1.9" ry="1.5" /></symbol>
      <symbol id="i-link" viewBox="0 0 16 16"><path d="M6.6 9.4a2.6 2.6 0 0 0 3.7 0l2.4-2.4a2.6 2.6 0 0 0-3.7-3.7l-.9.9M9.4 6.6a2.6 2.6 0 0 0-3.7 0L3.3 9a2.6 2.6 0 0 0 3.7 3.7l.9-.9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" /></symbol>
      <symbol id="i-radio" viewBox="0 0 16 16"><circle cx="8" cy="8" r="1.6" /><path d="M5.2 5.2a4 4 0 0 0 0 5.6M10.8 5.2a4 4 0 0 1 0 5.6M3.1 3.1a7 7 0 0 0 0 9.8M12.9 3.1a7 7 0 0 1 0 9.8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" /></symbol>
      <symbol id="i-balance" viewBox="0 0 16 16"><path d="M2 8h12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" /><path d="M2.5 5v6M13.5 5v6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" /><circle cx="8" cy="8" r="2.2" /></symbol>
    </svg>

    <main class="app">
      <section class="player" aria-label="Player">
        <div class="display island">
          <div class="screen" id="screen" title="Click to change the analyzer colors">
            <div class="clock is-idle" id="clock">
              <svg class="state-icon"><use id="stateIcon" href="#i-stop" /></svg>
              <span id="clockText">00:00</span>
            </div>
            <canvas id="canvas"></canvas>
          </div>
          <div class="now-playing">
            <div class="station" id="station">No cartridge loaded</div>
            <div class="title-row" id="titleRow"><span id="title" class="is-dim">Load a cartridge to start</span></div>
            <div class="specs">
              <span class="spec"><b id="kbps">--</b> kbps</span>
              <span class="spec"><b id="khz">--</b> kHz</span>
              <span class="channels">
                <span class="channel" id="mono">Mono</span>
                <span class="channel" id="stereo">Stereo</span>
              </span>
            </div>
          </div>
        </div>

        <!-- For a file (it has a duration), a seek bar on top, and volume and balance share a line. -->
        <div class="sliders island" id="sliders">
          <div class="slider-row seek-row">
            <div class="slider" id="seekSlider" role="slider" tabindex="0" aria-label="Position" aria-valuemin="0" aria-valuemax="10000">
              <div class="slider-rail"><div class="slider-fill"></div><div class="slider-thumb"></div></div>
            </div>
            <span class="seek-time" id="seekTime">0:00 / 0:00</span>
          </div>
          <div class="slider-pair">
            <div class="slider-row">
              <svg class="slider-icon"><use id="volumeIcon" href="#i-vol-2" /></svg>
              <div class="slider" id="volumeSlider" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100">
                <div class="slider-rail"><div class="slider-fill"></div><div class="slider-thumb"></div></div>
              </div>
              <span class="slider-value" id="volumeValue">50%</span>
            </div>
            <div class="slider-row">
              <svg class="slider-icon"><use href="#i-balance" /></svg>
              <div class="slider is-centered" id="balanceSlider" role="slider" tabindex="0" aria-label="Balance" aria-valuemin="-100" aria-valuemax="100" title="Double-click to center">
                <div class="slider-rail"><div class="slider-fill"></div><div class="slider-thumb"></div></div>
              </div>
              <span class="slider-value" id="balanceValue">C</span>
            </div>
          </div>
        </div>

        <div class="transport island">
          <button class="button accent icon" id="playButton" title="Play" aria-label="Play"><svg><use href="#i-play" /></svg></button>
          <button class="button icon" id="pauseButton" title="Pause" aria-label="Pause"><svg><use href="#i-pause" /></svg></button>
          <button class="button icon" id="stopButton" title="Stop" aria-label="Stop"><svg><use href="#i-stop" /></svg></button>
          <button class="button icon" id="instantButton" aria-pressed="false" aria-label="Instant switch"><svg><use href="#i-bolt" /></svg></button>
          <button class="button icon" id="infoButton" title="Stream information" aria-label="Stream information"><svg><use href="#i-info" /></svg></button>
          <button class="button icon" id="settingsButton" title="Settings" aria-label="Settings"><svg><use href="#i-settings" /></svg></button>
        </div>
      </section>

      <section class="deck">
        <div class="cartridges" id="cartridges" aria-label="Cartridges"></div>
        <div class="deck-bar island">
          <button class="button" id="playlistButton" aria-expanded="false" aria-controls="drawer" title="Show or hide the playlist">
            <svg><use href="#i-list" /></svg>Playlist<svg class="chevron"><use href="#i-chevron" /></svg>
          </button>
          <button class="button" id="addFileButton" title="Add music files or playlists from your computer"><svg><use href="#i-note" /></svg>Add file</button>
          <button class="button" id="addUrlButton" title="Add a stream or an online audio file"><svg><use href="#i-link" /></svg>Add URL</button>
        </div>
      </section>
    </main>

    <section class="drawer" id="drawer" aria-label="Playlist" inert>
      <div class="playlist island" id="playlist" role="listbox" tabindex="0" aria-multiselectable="true" aria-label="Playlist"></div>
      <div class="playlist-status">
        <span id="playlistCount"></span>
        <span id="playlistHint">Double-click to play · drag to reorder · Delete to remove</span>
      </div>
    </section>

    <div class="dialog-backdrop" id="dialog" hidden>
      <form class="dialog" id="dialogForm" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" novalidate>
        <div class="dialog-body">
          <h2 id="dialogTitle">Load cartridge</h2>
          <label class="field"><span id="nameLabel">Name</span>
            <input class="textbox" id="streamTitle" type="text" autocomplete="off" spellcheck="false" placeholder="My station" />
          </label>
          <label class="field"><span id="urlLabel">Stream URL</span>
            <input class="textbox" id="streamURL" type="text" autocomplete="off" spellcheck="false" placeholder="https://" />
          </label>
          <div class="dialog-error" id="dialogError" hidden></div>
        </div>
        <div class="dialog-footer">
          <button class="button accent" type="submit" id="saveButton">Save</button>
          <button class="button" type="button" id="ejectButton">Eject</button>
          <button class="button" type="button" id="cancelButton">Cancel</button>
        </div>
      </form>
    </div>


    <script src="js/bridge.js"></script>
    <script src="js/visualizer.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
